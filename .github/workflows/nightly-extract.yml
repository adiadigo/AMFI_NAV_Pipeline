name: nightly-extract

on:
  schedule:
    - cron: "17 18 * * *"   # 23:47 IST, after AMFI's 7–11 PM publish window
    - cron: "17 1 * * *"    # 06:47 IST, catch-up in case AMFI publishes late
  workflow_dispatch:         # adds a "Run workflow" button for testing

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python extractor/extract_navall.py
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
